    document.getElementById('tabs').innerHTML = TABS.map(t =>
      `<button class="tab" role="tab" aria-selected="${t.id === tab.id}" data-id="${esc(t.id)}" ${t.person ? `style="--tab-c:${t.person.color}"` : ''}>` +
      `${t.person ? `<span class="dot" style="--c:${t.person.color}"></span>` : ''}${esc(t.label)}</button>`).join('');
    let html;
    if (tab.id === 'group') {
      html = bar('The best bets for all four of you. Chips show each person’s predicted score; bright chips are well above that person’s usual scores, faded ones below.') + list(D.lists.group, {});
    } else if (tab.person) {
      const p = tab.person;
      html = bar(`Ranked by ${esc(p.name)}’s predicted score, with the club films behind each prediction.`) +
        list(D.lists[p.name], { person: p }) +
        `<h2>${esc(p.name)}’s wildcards</h2><p class="lede">Still among ${esc(p.name)}’s best predictions, but these lean on ${esc(p.name)}’s own taste rather than the crowd’s: good candidates for ${esc(p.name)}’s next pick.</p>` +
        list(D.lists[p.name + ':wild'], { person: p, mode: 'wild' });
    } else if (tab.id === 'divisive') {
      html = bar('Well-rated films where you’re predicted to split the most. Good for a discussion.') + list(D.lists.divisive, { mode: 'split' });
    } else if (tab.id === 'deep') {
      html = bar('Group picks with fewer than 1,500 MovieLens ratings, so less likely that anyone has seen them.') + list(D.lists.deep_cuts, {});
    } else {
      html = howItWorks();
    }
    document.getElementById('view').innerHTML = html;
    const cb = document.getElementById('hidePop');
    if (cb) cb.addEventListener('change', e => { hidePopular = e.target.checked; store.set('upnext.hidePopular', hidePopular ? '1' : '0'); render(); });
  }

  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (b) go(b.dataset.id);
  });
  window.addEventListener('hashchange', () => { current = fromHash() || 'group'; render(); });
  document.getElementById('footer').innerHTML =
    'Recommendations use the <a href="https://grouplens.org/datasets/movielens/">MovieLens 32M</a> dataset (F. Maxwell Harper and Joseph A. Konstan, 2015, ' +
    '“The MovieLens Datasets: History and Context”, ACM TiiS 5(4)); not endorsed by GroupLens. Film links via TMDB, IMDb and Letterboxd.';
  render();
})();
</script>
</body>
</html>
